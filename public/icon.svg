<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ll-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ll-ring" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ll-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#ll-bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#334155" stroke-opacity="0.55" stroke-width="4"/>

  <!-- Primary sweeping painterly brush-stroke O ring -->
  <path
    d="M 272 108 C 358 114, 412 184, 404 268 C 396 352, 326 408, 244 402 C 160 396, 102 328, 110 242 C 118 164, 180 106, 260 108 C 282 109, 304 114, 322 122"
    fill="none"
    stroke="url(#ll-ring)"
    stroke-width="34"
    stroke-linecap="round"
  />

  <!-- Inner textured dry-brush bristle stroke -->
  <path
    d="M 232 132 C 164 146, 126 206, 134 274 C 142 338, 198 384, 268 380 C 336 376, 386 322, 384 252 C 383 224, 374 198, 358 178"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.88"
    stroke-width="14"
    stroke-linecap="round"
    stroke-dasharray="210 26 92 18 140 22"
  />

  <!-- Outer dynamic brush flare & cyan accent sweep -->
  <path
    d="M 142 152 C 186 106, 266 94, 330 124 C 378 146, 406 196, 402 252"
    fill="none"
    stroke="url(#ll-accent)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-dasharray="145 20 68 16 80"
  />

  <!-- Lower dry-brush taper flick -->
  <path
    d="M 134 334 C 174 388, 250 412, 318 386 C 354 372, 382 344, 396 310"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.72"
    stroke-width="9"
    stroke-linecap="round"
    stroke-dasharray="96 18 54 14 40"
  />
</svg>
